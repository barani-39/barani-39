<g font-family="Arial, sans-serif">
<text x="48" y="59" fill="#6feaf5" font-size="15" letter-spacing="1.5">01 / PRODUCT ENGINEERING</text>
<text x="48" y="104" fill="#f2f7ff" font-size="30" font-weight="700">SaaS &amp; APIs</text>
<text x="48" y="140" fill="#9ab7d1" font-size="18">Full-stack workflows</text><text x="48" y="166" fill="#9ab7d1" font-size="18">and dependable backends</text>
<text x="441" y="59" fill="#bbabff" font-size="15" letter-spacing="1.5">02 / APPLIED AI</text>
<text x="441" y="104" fill="#f2f7ff" font-size="30" font-weight="700">Agents &amp; Local AI</text>
<text x="441" y="140" fill="#b4acd9" font-size="18">Tool-driven systems</text><text x="441" y="166" fill="#b4acd9" font-size="18">with controlled execution</text>
<text x="834" y="59" fill="#82c9ff" font-size="15" letter-spacing="1.5">03 / ENGINEERING QUALITY</text>
<text x="834" y="104" fill="#f2f7ff" font-size="30" font-weight="700">Security &amp; Tests</text>
<text x="834" y="140" fill="#a5bddb" font-size="18">Isolation, verification,</text><text x="834" y="166" fill="#a5bddb" font-size="18">and failure recovery</text>
</g>
